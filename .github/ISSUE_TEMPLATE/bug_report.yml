name: Bug report
description: Report incorrect filtering, classification, ramp, or plan behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include ordered values, specification, and resolved result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or crate version
    validations:
      required: true
