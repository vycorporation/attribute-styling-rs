[package]
name = "attribute-styling"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Renderer-neutral attribute filtering, classification, and style resolution"
repository = "https://github.com/vycorporation/attribute-styling-rs"
readme = "README.md"
keywords = ["gis", "classification", "styling", "color", "attributes"]
categories = ["graphics", "science::geo"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
